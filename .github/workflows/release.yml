name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.4"
      - run: bundle install

      - name: Verify tagged commit is on main
        if: github.event_name == 'push'
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main" >&2
            exit 1
          fi

      - name: Read release metadata
        id: metadata
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: bundle exec rake "release:metadata[${TAG}]" >> "${GITHUB_OUTPUT}"

      - name: Build gem and release notes
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          mkdir dist
          gem build drip-ruby.gemspec --output "dist/drip-ruby-${VERSION}.gem"
          bundle exec rake "release:notes[${VERSION}]" > dist/release-notes.md
          cat dist/release-notes.md >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: dist
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.4"
      - uses: rubygems/configure-rubygems-credentials@bc6dd217f8a4f919d6835fcfefd470ef821f5c44 # v1.0.0

      - name: Create or update the draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          draft="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          case "${draft}" in
            missing)
              flags=(--draft --verify-tag --title "${TAG}" --notes-file dist/release-notes.md)
              if [ "${PRERELEASE}" = "true" ]; then flags+=(--prerelease); fi
              gh release create "${TAG}" dist/*.gem --repo "${GITHUB_REPOSITORY}" "${flags[@]}"
              ;;
            true)
              gh release upload "${TAG}" dist/*.gem --repo "${GITHUB_REPOSITORY}" --clobber
              ;;
            *)
              echo "release ${TAG} is already published"
              ;;
          esac

      - name: Push gem to RubyGems
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if curl -fsS https://rubygems.org/api/v1/versions/drip-ruby.json |
              jq -e --arg v "${VERSION}" 'any(.[]; .number == $v)' >/dev/null; then
            echo "drip-ruby ${VERSION} is already on RubyGems"
          else
            gem push "dist/drip-ruby-${VERSION}.gem"
          fi

  publish:
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
